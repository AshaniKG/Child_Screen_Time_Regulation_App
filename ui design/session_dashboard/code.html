<!-- Protection Scope Section (Placed Neatly Below Controls) -->
<div class="w-full bg-surface-container-lowest rounded-lg p-space-lg shadow-sm flex flex-col gap-space-md">

    <a class="font-label-sm text-label-sm text-secondary font-semibold hover:underline flex items-center gap-0.5" href="#">
      <span class="material-symbols-outlined text-[16px]">tune</span>

    </a>
  </div>
  <div class="grid grid-cols-1 gap-2.5">

        <div class="w-10 h-10 rounded-xl bg-secondary-container flex items-center justify-center flex-shrink-0 text-on-secondary-container">
          <span class="material-symbols-outlined text-[20px]">lock</span>
        </div>
        <div class="flex flex-col min-w-0">
          <span class="font-label-lg text-label-lg text-primary truncate font-semibold">Fully Blocked Apps</span>
          <span class="font-body-sm text-body-sm text-on-surface-variant truncate">1 App: ASMR Makeup</span>
        </div>

        </div>
      </div>
      <span class="px-2.5 py-1 rounded-full bg-secondary-container/50 text-on-secondary-container font-label-sm text-label-sm font-semibold flex-shrink-0">Sensory Lag</span>

<script>
  (function () {
    const durationDisplay = document.getElementById('selected-duration-display');
    const startBtnLabel = document.getElementById('start-btn-label');
    const slider = document.getElementById('duration-slider');
    const pills = document.querySelectorAll('.duration-pill');
    const winddownChips = document.querySelectorAll('.winddown-chip');
    const winddownDisplay = document.getElementById('winddown-display');
    const searchInput = document.getElementById('app-search-input');
    const clearSearch = document.getElementById('clear-search');
    const appItems = document.querySelectorAll('.app-item');
    const emptyState = document.getElementById('empty-search-state');
    const blockedBadge = document.getElementById('blocked-badge');
    const blockAllBtn = document.getElementById('block-all-btn');
    const unblockAllBtn = document.getElementById('unblock-all-btn');

    let currentDuration = 30;

    function updateDuration(val, isCustom) {
      currentDuration = val;
      durationDisplay.textContent = val;
      startBtnLabel.textContent = 'Start Session (' + val + ' min)';
      slider.value = val;

      pills.forEach(p => {
        p.classList.remove('bg-surface-container-lowest', 'text-primary', 'shadow-sm', 'font-semibold');
        p.classList.add('text-on-surface-variant');
        if (p.getAttribute('data-duration') == val || (isCustom && p.getAttribute('data-duration') === 'custom')) {
          p.classList.remove('text-on-surface-variant');
          p.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-sm', 'font-semibold');
        }
      });
    }

    pills.forEach(pill => {
      pill.addEventListener('click', () => {
        const d = pill.getAttribute('data-duration');
        if (d === 'custom') {
          updateDuration(slider.value, true);
        } else {
          updateDuration(parseInt(d, 10), false);
        }
      });
    });

    slider.addEventListener('input', (e) => {
      updateDuration(e.target.value, true);
    });

    // Wind-down selector
    winddownChips.forEach(chip => {
      chip.addEventListener('click', () => {
        winddownChips.forEach(c => {
          c.classList.remove('bg-primary', 'text-on-primary', 'font-semibold', 'shadow-sm');
          c.classList.add('bg-surface-container', 'text-on-surface-variant');
        });
        chip.classList.remove('bg-surface-container', 'text-on-surface-variant');
        chip.classList.add('bg-primary', 'text-on-primary', 'font-semibold', 'shadow-sm');
        const min = chip.getAttribute('data-winddown');
        winddownDisplay.textContent = min + ' min';
      });
    });

    // Update Blocked App Count badge
    function updateBlockedBadge() {
      const activeCount = document.querySelectorAll('.switch-toggle[aria-checked="true"]').length;
      blockedBadge.textContent = activeCount + ' of 65 Blocked';
    }

    // Interactive Jetpack Compose-style Switch toggles
    document.querySelectorAll('.switch-toggle').forEach(toggle => {
      toggle.addEventListener('click', () => {
        const isChecked = toggle.getAttribute('aria-checked') === 'true';
        setSwitchState(toggle, !isChecked);
        updateBlockedBadge();
      });
    });

    function setSwitchState(toggle, checked) {
      const thumb = toggle.querySelector('.switch-thumb');
      const icon = thumb.querySelector('.material-symbols-outlined');
      toggle.setAttribute('aria-checked', checked ? 'true' : 'false');

      if (checked) {
        toggle.classList.remove('bg-surface-container-highest');
        toggle.classList.add('bg-primary');
        thumb.classList.remove('translate-x-0');
        thumb.classList.add('translate-x-5');
        icon.classList.remove('opacity-0');
        icon.classList.add('opacity-100');
      } else {
        toggle.classList.remove('bg-primary');
        toggle.classList.add('bg-surface-container-highest');
        thumb.classList.remove('translate-x-5');
        thumb.classList.add('translate-x-0');
        icon.classList.remove('opacity-100');
        icon.classList.add('opacity-0');
      }
    }

    // Quick Actions
    blockAllBtn.addEventListener('click', () => {
      document.querySelectorAll('.switch-toggle').forEach(t => setSwitchState(t, true));
      updateBlockedBadge();
    });

    unblockAllBtn.addEventListener('click', () => {
      document.querySelectorAll('.switch-toggle').forEach(t => setSwitchState(t, false));
      updateBlockedBadge();
    });

    // App List Search Filtering
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      clearSearch.classList.toggle('hidden', query.length === 0);

      let visibleCount = 0;
      appItems.forEach(item => {
        const name = item.getAttribute('data-name');
        const pkg = item.getAttribute('data-package');
        if (name.includes(query) || pkg.includes(query)) {
          item.classList.remove('hidden');
          visibleCount++;
        } else {
          item.classList.add('hidden');
        }
      });

      emptyState.classList.toggle('hidden', visibleCount > 0);
    });

    clearSearch.addEventListener('click', () => {
      searchInput.value = '';
      clearSearch.classList.add('hidden');
      appItems.forEach(item => item.classList.remove('hidden'));
      emptyState.classList.add('hidden');
      searchInput.focus();
    });

    // Primary action haptic micro-interaction
    const startBtn = document.getElementById('start-btn');
    startBtn.addEventListener('click', () => {
      const originalText = startBtnLabel.textContent;
      startBtnLabel.textContent = 'Starting Wind-Down...';
      startBtn.classList.add('opacity-90');
      setTimeout(() => {
        startBtnLabel.textContent = 'Session Active (' + currentDuration + 'm)';
      }, 700);
    });

  })();
</script></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-2px_16px_rgba(30,42,74,0.05)]" data-active-classes="[&amp;_.compose-indicator]:bg-secondary-container [&amp;_.compose-indicator]:w-16 [&amp;_.compose-icon]:text-on-secondary-container font-label-md text-primary font-semibold"><div class="h-20 px-space-md flex items-center justify-around max-w-md mx-auto"><a aria-current="page" class="flex flex-col items-center justify-center gap-1 min-w-[72px] h-12 transition-all select-none group [&amp;_.compose-indicator]:bg-secondary-container [&amp;_.compose-indicator]:w-16 [&amp;_.compose-icon]:text-on-secondary-container font-label-md text-primary font-semibold" data-path="session-dashboard" href="#"><div class="compose-indicator w-10 h-7 rounded-full flex items-center justify-center transition-all duration-200"><span class="compose-icon material-symbols-outlined text-[22px] transition-colors">screen_lock_rotation</span></div><span class="font-label-sm text-label-sm transition-colors">Session</span></a><a class="flex flex-col items-center justify-center gap-1 min-w-[72px] h-12 text-on-surface-variant hover:text-on-surface transition-all select-none group" data-path="wind-down-settings" href="#"><div class="compose-indicator w-10 h-7 rounded-full flex items-center justify-center transition-all duration-200"><span class="compose-icon material-symbols-outlined text-[22px] transition-colors">tune</span></div><span class="font-label-sm text-label-sm transition-colors">Settings</span></a></div><div class="w-full flex justify-center pb-2 pt-0.5"><div class="w-28 h-1 rounded-full bg-outline/25"></div></div></nav>
