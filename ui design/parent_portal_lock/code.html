<!DOCTYPE html><html class="h-full" lang="en" style=""><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,600;1,400;1,600&amp;family=Manrope:wght@600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100%;min-height:100%;margin:0;padding:0;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-variant": "#dde2f1", "on-primary-container": "#8691b7", "on-tertiary-fixed": "#001f27", "inverse-surface": "#2b313c", "on-secondary-container": "#1a6e6c", "secondary-container": "#a2edea", "inverse-primary": "#bac5ee", "on-secondary": "#ffffff", "on-tertiary-fixed-variant": "#184d5a", "on-primary": "#ffffff", "surface-container-lowest": "#ffffff", "outline-variant": "#c6c6cf", "tertiary-fixed-dim": "#9dcede", "on-secondary-fixed-variant": "#00504e", "surface-container-high": "#e3e8f7", "on-tertiary-container": "#6a9aa8", "surface-container": "#e8eefd", "surface-container-low": "#f0f3ff", "on-secondary-fixed": "#00201f", "inverse-on-surface": "#ecf1ff", "primary-fixed": "#dae2ff", "on-primary-fixed-variant": "#3a4667", "secondary-fixed": "#a5f0ed", "tertiary-container": "#00303a", "on-surface-variant": "#45464e", "error": "#ba1a1a", "surface-container-highest": "#dde2f1", "outline": "#76777f", "primary-container": "#1e2a4a", "on-tertiary": "#ffffff", "surface-dim": "#d4dae9", "on-primary-fixed": "#0d1a39", "surface-bright": "#f9f9ff", "tertiary": "#001a20", "surface-tint": "#525d80", "background": "#f9f9ff", "primary-fixed-dim": "#bac5ee", "on-error-container": "#93000a", "secondary": "#126967", "primary": "#081534", "secondary-fixed-dim": "#89d3d1", "on-background": "#161c26", "surface": "#f9f9ff", "on-error": "#ffffff", "error-container": "#ffdad6", "tertiary-fixed": "#b9eafa", "on-surface": "#161c26" }, "borderRadius": { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, "spacing": { "space-xl": "2.5rem", "space-sm": "0.5rem", "margin": "1.25rem", "space-xs": "0.25rem", "margin-desktop": "3rem", "space-lg": "1.5rem", "space-md": "1rem", "gutter-desktop": "1.5rem", "margin-tablet": "2rem", "gutter": "1rem" }, "fontFamily": { "label-md": ["Hanken Grotesk"], "headline-lg": ["Manrope"], "headline-lg-mobile": ["Manrope"], "display-lg": ["Manrope"], "label-lg": ["Hanken Grotesk"], "label-sm": ["Hanken Grotesk"], "display-lg-mobile": ["Manrope"], "headline-md": ["Manrope"], "headline-sm": ["Manrope"], "body-lg": ["Hanken Grotesk"], "body-sm": ["Hanken Grotesk"], "body-md": ["Hanken Grotesk"] }, "fontSize": { "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}], "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600"}], "headline-lg-mobile": ["26px", {"lineHeight": "34px", "letterSpacing": "-0.015em", "fontWeight": "600"}], "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.03em", "fontWeight": "700"}], "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}], "label-sm": ["11px", {"lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "600"}], "display-lg-mobile": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.025em", "fontWeight": "700"}], "headline-md": ["22px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600"}], "headline-sm": ["18px", {"lineHeight": "24px", "letterSpacing": "-0.005em", "fontWeight": "600"}], "body-lg": ["17px", {"lineHeight": "26px", "letterSpacing": "-0.01em", "fontWeight": "400"}], "body-sm": ["13px", {"lineHeight": "18px", "letterSpacing": "0.005em", "fontWeight": "400"}], "body-md": ["15px", {"lineHeight": "22px", "letterSpacing": "0em", "fontWeight": "400"}] } } } }</script></head><body class="bg-surface font-body-md text-on-surface min-h-screen flex flex-col antialiased selection:bg-secondary-container selection:text-on-secondary-container"><header class="fixed top-0 inset-x-0 z-50 bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(30,42,74,0.04)] pt-safe"></header><main class="flex-1 flex flex-col relative w-full pt-16 pb-safe bg-surface"><div class="flex flex-col w-full px-margin pb-space-xl">
<!-- Subtle Ambient Glow & Focus Context Header -->

<!-- Main Security Elevation Card -->
<div class="relative w-full mt-space-sm rounded-lg bg-surface-container-lowest p-space-lg shadow-xl shadow-primary/5 flex flex-col items-center text-center overflow-hidden">
<!-- Ambient Radial Hue in Card -->

<!-- Center Elevated Brand / Biometric Security Emblem -->
<div class="relative mt-2 mb-space-md flex items-center justify-center"><div class="w-20 h-20 rounded-full overflow-hidden shadow-lg shadow-primary/10 flex items-center justify-center bg-primary-container"><img src="https://lh3.googleusercontent.com/aida/AEtjO1Xdm6fuJiQN32StZd7hT4EPFyYuG6I5HnERCIi79C_ADqevlXUVFS7pDXRgBvX6ZOMnPgeLrVHQkXO_6VGqw0OYjhfk5B4nP9q5KPkKtH3UhLrr_-rVQ0I2BbbNY5WnxbRQCvjtqoTcsbvHDpYIU0QzBdiQ6L-htfCP6ooO6ocCTs1hMJ1l_3c0DgWKdB-iPp1XTqPFzKUY2G15o0z1Xx9dsIOhPQvjFj6jf6Fw468tHLDEoMF6kzKT_RLq" alt="TurnAway Shield &amp; Hourglass Logo" class="w-full h-full object-cover"></div></div>
<!-- Title & Subtitle Hierarchy -->
<h2 class="font-headline-md text-headline-md text-primary tracking-tight">TurnAway Portal</h2>

<!-- Biometric Sensor Touch Surface Button -->
<button class="relative group w-full mt-space-lg py-4 px-space-md rounded-full bg-primary text-on-primary font-label-lg text-label-lg shadow-md hover:bg-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-3 overflow-hidden" id="biometric-trigger">
<!-- Shimmer Beam -->
<span class="absolute inset-0 w-1/2 h-full bg-gradient-to-r from-transparent via-white/10 to-transparent -skew-x-12 -translate-x-full group-hover:translate-x-[300%] transition-transform duration-1000 ease-out pointer-events-none"></span>
<!-- Glowing Fingerprint Glyph with Ambient Ring -->
<span class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-secondary-fixed">
<span class="material-symbols-outlined text-[22px]" style="font-variation-settings: 'wght' 500;">fingerprint</span>
</span>
<span id="biometric-btn-text" class="">Unlock&nbsp;</span>
</button>
<!-- Alternative Access Methods -->
<div class="w-full flex flex-col gap-2 mt-space-md">
<!-- Use PIN Passcode Button -->

<!-- PIN Code Numpad Drawer (Collapsible) -->

</div>
<!-- Emergency 5-Minute Grace Period Link -->
<div class="mt-space-md pt-space-xs">

</div>
</div>
<!-- Biometric Verification Prompt Card (Simulated Android System Sheet) -->
<div class="hidden fixed inset-x-4 bottom-8 rounded-lg bg-inverse-surface text-inverse-on-surface p-space-md shadow-2xl flex items-center gap-space-md z-40 transition-all duration-300" id="biometric-hud">
<div class="w-12 h-12 rounded-full bg-secondary flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-secondary text-[26px] animate-pulse">fingerprint</span>
</div>
<div class="flex-1 min-w-0 text-left">
<div class="font-label-lg text-label-lg text-inverse-on-surface truncate">Touch Fingerprint Sensor</div>
<div class="font-body-sm text-body-sm text-inverse-primary truncate">Awaiting hardware validation...</div>
</div>
<button class="px-3 py-1.5 rounded-full bg-surface-container-highest/20 text-inverse-on-surface font-label-md text-label-md active:bg-surface-container-highest/40" id="cancel-prompt">
      Cancel
    </button>
</div>
<!-- Quick Info Mosaic: Policy Protection Status -->
<div class="grid grid-cols-2 gap-space-sm mt-space-md">
<div class="rounded-lg bg-surface-container-low p-space-md flex flex-col justify-between">
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-secondary mb-2">
<span class="material-symbols-outlined text-[18px]">visibility</span>
</div>
<div>
<div class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Screen Distance</div>
<div class="font-headline-sm text-headline-sm text-primary mt-0.5">30cm Lock</div>
</div>
<div class="font-body-sm text-body-sm text-secondary mt-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">check_circle</span>
        Active TrueDepth
      </div>
</div>
<div class="rounded-lg bg-surface-container-low p-space-md flex flex-col justify-between">
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-secondary mb-2">
<span class="material-symbols-outlined text-[18px]">bedtime</span>
</div>
<div>
<div class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Curfew Window</div>
<div class="font-headline-sm text-headline-sm text-primary mt-0.5">8:30 PM</div>
</div>
<div class="font-body-sm text-body-sm text-on-surface-variant mt-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">schedule</span>
        Until 07:00 AM
      </div>
</div>
</div>
<!-- Android BiometricPrompt Architecture Assurance Stamp -->

</div>
<script>
  (function () {
    const bioBtn = document.getElementById('biometric-trigger');
    const hud = document.getElementById('biometric-hud');
    const cancelPrompt = document.getElementById('cancel-prompt');
    const pinTrigger = document.getElementById('pin-trigger');
    const pinBox = document.getElementById('pin-box');
    const pinDots = document.querySelectorAll('.pin-dot');
    const pinKeys = document.querySelectorAll('.pin-key');
    const graceBtn = document.getElementById('grace-period-btn');
    const bioText = document.getElementById('biometric-btn-text');

    let currentPin = '';

    // Biometric Simulation
    bioBtn?.addEventListener('click', () => {
      hud?.classList.remove('hidden');
      bioText.textContent = 'Scanning Sensor...';

      setTimeout(() => {
        if (!hud?.classList.contains('hidden')) {
          hud.classList.add('hidden');
          bioText.textContent = 'Authenticated ✓';
          bioBtn.classList.remove('bg-primary');
          bioBtn.classList.add('bg-secondary');
          setTimeout(() => {
            bioText.textContent = 'Unlock with Fingerprint';
            bioBtn.classList.remove('bg-secondary');
            bioBtn.classList.add('bg-primary');
          }, 2400);
        }
      }, 1600);
    });

    cancelPrompt?.addEventListener('click', () => {
      hud?.classList.add('hidden');
      bioText.textContent = 'Unlock with Fingerprint';
    });

    // PIN Pad Toggle
    pinTrigger?.addEventListener('click', () => {
      const isHidden = pinBox.classList.contains('hidden');
      if (isHidden) {
        pinBox.classList.remove('hidden');
        pinTrigger.classList.add('bg-surface-container-high');
      } else {
        pinBox.classList.add('hidden');
        pinTrigger.classList.remove('bg-surface-container-high');
      }
    });

    // Numpad Logic
    pinKeys.forEach((key) => {
      key.addEventListener('click', (e) => {
        const val = e.currentTarget.getAttribute('data-val');
        if (val === 'clear') {
          currentPin = '';
        } else if (val === 'back') {
          currentPin = currentPin.slice(0, -1);
        } else if (val && currentPin.length < 4) {
          currentPin += val;
        }

        // Render Dots
        pinDots.forEach((dot, index) => {
          if (index < currentPin.length) {
            dot.classList.remove('bg-surface-container-highest');
            dot.classList.add('bg-secondary');
          } else {
            dot.classList.add('bg-surface-container-highest');
            dot.classList.remove('bg-secondary');
          }
        });

        // Auto verify on 4 digits
        if (currentPin.length === 4) {
          setTimeout(() => {
            currentPin = '';
            pinDots.forEach((dot) => {
              dot.classList.remove('bg-secondary');
              dot.classList.add('bg-surface-container-highest');
            });
            pinBox.classList.add('hidden');
            pinTrigger.classList.remove('bg-surface-container-high');
            alert('Parental Access Granted');
          }, 300);
        }
      });
    });

    // Grace Period micro feedback
    graceBtn?.addEventListener('click', () => {
      const originalText = graceBtn.innerHTML;
      graceBtn.innerHTML = '<span class="material-symbols-outlined text-[16px] animate-spin">sync</span> Requesting 5m Access...';
      setTimeout(() => {
        graceBtn.innerHTML = '<span class="material-symbols-outlined text-[16px] text-secondary">check</span> 5m Grace Period Enabled';
        setTimeout(() => {
          graceBtn.innerHTML = originalText;
        }, 3000);
      }, 1000);
    });
  })();
</script></main><div class="fixed bottom-0 inset-x-0 pointer-events-none pb-2 pt-1 flex justify-center"><div class="w-28 h-1 rounded-full bg-outline/25"></div></div>

</body></html>
